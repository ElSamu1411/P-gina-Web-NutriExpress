# URL de conexión (Apunta al puerto 5432 de tu contenedor local)
spring.datasource.url=jdbc:postgresql://localhost:5432/nutriexpress

# Credenciales de PostgreSQL configuradas en tu docker-compose
spring.datasource.username=admin
spring.datasource.password=password123

# Evita que Spring sobreescriba las tablas que ya creamos con tu script SQL
spring.jpa.hibernate.ddl-auto=none

# Muestra en la consola de IntelliJ el SQL que se ejecuta por detrás (útil para depurar)
spring.jpa.show-sql=false

