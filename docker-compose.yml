version: '3.8'

services:
  nutriexpress-db:
    image: postgres:15
    container_name: bd_nutriexpress
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: nutriexpress
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: